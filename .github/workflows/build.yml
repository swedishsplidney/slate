name: build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SDL_VERSION: "3.2.20"
  VULKAN_SDK_VERSION: "1.4.309.0"
  SMOKE_ARGS: ""
  CMAKE_COMMON: >-
    -DCMAKE_BUILD_TYPE=Release
    -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    -DTARGET_UNIT_TESTS=OFF
    -DTARGET_HELLO_WORLD=OFF
    -DTARGET_PERFORMANCE_TEST=OFF
    -DTARGET_SAMPLES=OFF
    -DTARGET_VIEWER=OFF

jobs:
  preflight:
    name: preflight checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: required files + content sanity
        run: |
          shopt -s globstar nullglob
          fail=0
          
          for p in CMakeLists.txt assets models shaders external assets/slate_icon.png; do
            [ -e "$p" ] || { echo "::error::missing in checkout: $p"; fail=1; }
          done
          for d in assets models shaders; do
            if [ -d "$d" ] && [ -z "$(ls -A "$d")" ]; then
              echo "::error::$d/ is empty (gitignored? untracked? empty dirs aren't tracked by git)"; fail=1
            fi
          done
          
          # unresolved git-lfs pointer files = LFS didn't actually pull
          ptrs=$(grep -rIl '^version https://git-lfs.github.com/spec/v1' assets models shaders 2>/dev/null || true)
          if [ -n "$ptrs" ]; then echo "::error::LFS pointer files not resolved:"; echo "$ptrs"; fail=1; fi
          
          # shaders: need at least one, and basenames must be unique (cmake target names are per-basename)
          mapfile -t shaders < <(find shaders -type f \( -name '*.vert' -o -name '*.frag' \))
          if [ ${#shaders[@]} -eq 0 ]; then echo "::error::no .vert/.frag shaders found"; fail=1; fi
          dups=$(printf '%s\n' "${shaders[@]}" | xargs -n1 basename | sort | uniq -d)
          if [ -n "$dups" ]; then echo "::error::duplicate shader filenames: $dups"; fail=1; fi
          
          exit $fail

      - name: tag matches CMake project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cmake_ver=$(sed -nE 's/^project\(slate VERSION ([0-9.]+).*/\1/p' CMakeLists.txt | head -n1)
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"
          echo "tag=$tag  cmake=$cmake_ver"
          if [ "$base" != "$cmake_ver" ]; then
            echo "::warning::tag ($GITHUB_REF_NAME) doesn't match project(VERSION $cmake_ver) in CMakeLists.txt"
          fi

  build:
    name: build and package (${{ matrix.name }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos

    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: install vulkan SDK (linux/windows)
        if: runner.os != 'macOS'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true

      - name: install linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config git file xvfb \
            libglm-dev libfuse2 mesa-vulkan-drivers \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libdecor-0-dev libasound2-dev libpulse-dev \
            libdrm-dev libgbm-dev libudev-dev libdbus-1-dev libegl-dev libgl-dev

      - name: cache SDL3 (linux)
        if: runner.os == 'Linux'
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: ~/sdl3-install
          key: sdl3-${{ env.SDL_VERSION }}-${{ runner.os }}-v2

      - name: build SDL3 from source (linux)
        if: runner.os == 'Linux' && steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "release-${SDL_VERSION}" https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$HOME/sdl3-install" -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build /tmp/SDL/build
          cmake --install /tmp/SDL/build


      - name: cache vcpkg binaries (windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ runner.os }}-sdl3-glm-v1

      - name: install windows dependencies (vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sdl3:x64-windows glm:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }

      - name: install mac dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install sdl3 glm molten-vk vulkan-loader vulkan-headers shaderc spirv-tools \
            dylibbundler create-dmg coreutils

      - name: locate glslc
        shell: bash
        run: |
          g="$(command -v glslc || true)"
          if [ -z "$g" ] && [ -n "${VULKAN_SDK:-}" ]; then
            sdk="$VULKAN_SDK"
            if [ "$RUNNER_OS" = "Windows" ]; then sdk="$(cygpath -u "$VULKAN_SDK")"; fi
            g="$(/usr/bin/find "$sdk" -type f \( -name glslc -o -name glslc.exe \) | head -n1)"
          fi
          [ -n "$g" ] || { echo "::error::glslc not found (Vulkan SDK / shaderc missing?)"; exit 1; }
          if [ "$RUNNER_OS" = "Windows" ]; then g="$(cygpath -m "$g")"; fi
          echo "GLSLC=$g" >> "$GITHUB_ENV"
          "$g" --version

      - name: configure (linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -G Ninja $CMAKE_COMMON \
            -DCMAKE_PREFIX_PATH="$HOME/sdl3-install" \
            -DGLSLC_EXECUTABLE="$GLSLC"

      - name: configure (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tc = "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          if (-not (Test-Path $tc)) { throw "vcpkg toolchain not found at $tc" }
          $common = $env:CMAKE_COMMON -split '\s+'
          # Jolt defaults to the static CRT (/MT); vcpkg's x64-windows SDL3 uses the DLL CRT (/MD).
          # Mixing them gives LNK2038, so force Jolt onto /MD.
          cmake -B build -A x64 @common `
            "-DCMAKE_TOOLCHAIN_FILE=$tc" -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DUSE_STATIC_MSVC_RUNTIME_LIBRARY=OFF `
            "-DGLSLC_EXECUTABLE=$env:GLSLC"
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }

      - name: configure (macos)
        if: runner.os == 'macOS'
        run: |
          cmake -B build $CMAKE_COMMON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DGLSLC_EXECUTABLE="$GLSLC"

      - name: build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: verify build output (exe, assets, models, shaders)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then exe=build/Release/slate.exe; else exe=build/slate; fi
          test -f "$exe"        || { echo "::error::$exe not produced"; exit 1; }
          test -d build/assets  || { echo "::error::build/assets missing"; exit 1; }
          test -d build/models  || { echo "::error::build/models missing"; exit 1; }
          test -d build/shaders/compiled || { echo "::error::build/shaders/compiled missing"; exit 1; }

          src=$(/usr/bin/find shaders -type f \( -name '*.vert' -o -name '*.frag' \) | wc -l)
          spv=$(/usr/bin/find build/shaders/compiled -type f -name '*.spv' | wc -l)
          echo "shader sources: $src, compiled: $spv"
          [ "$src" -gt 0 ] && [ "$src" -eq "$spv" ] || { echo "::error::shader count mismatch ($src sources vs $spv .spv)"; exit 1; }

          # every .spv must start with the SPIR-V magic number (little-endian 03 02 23 07)
          for f in build/shaders/compiled/*.spv; do
            magic=$(od -An -tx1 -N4 "$f" | tr -d ' \n')
            [ "$magic" = "03022307" ] || { echo "::error::$f is not valid SPIR-V"; exit 1; }
          done

          # full validation when spirv-val is around
          if command -v spirv-val >/dev/null 2>&1; then
            for f in build/shaders/compiled/*.spv; do spirv-val "$f" || { echo "::error::spirv-val failed: $f"; exit 1; }; done
          else
            echo "::warning::spirv-val not on PATH, skipped full SPIR-V validation"
          fi

      - name: package + test AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin/shaders dist
          cp build/slate AppDir/usr/bin/
          cp -r build/assets build/models AppDir/usr/bin/
          cp -r build/shaders/compiled AppDir/usr/bin/shaders/compiled

          cat > slate.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Slate Engine
          Exec=slate
          Icon=slate
          Terminal=false
          Categories=Development;Graphics;
          EOF

          # AppImages launch with the user's cwd. Your engine copies assets next to the binary,
          # so run from there (works whether you load via cwd or SDL_GetBasePath).
          cat > AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:${LD_LIBRARY_PATH:-}"
          cd "$HERE/usr/bin"
          exec "$HERE/usr/bin/slate" "$@"
          EOF
          chmod +x AppRun

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          export APPIMAGE_EXTRACT_AND_RUN=1
          export LD_LIBRARY_PATH="$HOME/sdl3-install/lib:${VULKAN_SDK:+$VULKAN_SDK/lib}:${LD_LIBRARY_PATH:-}"
          export OUTPUT=slate-linux-x86_64.AppImage
          export LDAI_OUTPUT="$OUTPUT"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/slate \
            --desktop-file slate.desktop \
            --icon-file assets/slate_icon.png --icon-filename slate \
            --custom-apprun AppRun \
            --output appimage
          mv "$OUTPUT" dist/
          APP="$PWD/dist/$OUTPUT"
          chmod +x "$APP"

          # --- verify contents of the FINAL artifact ---
          ex=$(mktemp -d)
          (cd "$ex" && "$APP" --appimage-extract >/dev/null)
          ex="$ex/squashfs-root"
          test -x "$ex/usr/bin/slate"            || { echo "::error::slate missing in AppImage"; exit 1; }
          test -d "$ex/usr/bin/assets"           || { echo "::error::assets missing in AppImage"; exit 1; }
          test -d "$ex/usr/bin/models"           || { echo "::error::models missing in AppImage"; exit 1; }
          ls "$ex"/usr/bin/shaders/compiled/*.spv >/dev/null 2>&1 || { echo "::error::shaders missing in AppImage"; exit 1; }
          ls "$ex"/usr/lib/libSDL3* >/dev/null 2>&1 || { echo "::error::SDL3 not bundled"; exit 1; }
          missing=$(LD_LIBRARY_PATH="$ex/usr/lib" ldd "$ex/usr/bin/slate" | grep 'not found' || true)
          if [ -n "$missing" ]; then echo "::error::unresolved libs: $missing"; exit 1; fi

          # --- smoke test: run the real AppImage, from an unrelated cwd, WITHOUT our build-time lib paths ---
          unset LD_LIBRARY_PATH
          export APPIMAGE_EXTRACT_AND_RUN=1
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json   # lavapipe (software Vulkan)
          export SDL_VIDEODRIVER=x11
          cd /tmp
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 15 "$APP" $SMOKE_ARGS > /tmp/smoke.log 2>&1
          code=$?
          set -e
          echo "---- last 50 lines of output ----"; tail -n 50 /tmp/smoke.log; echo "---------------------------------"
          echo "exit code: $code"
          if grep -Eqi 'error while loading shared libraries|cannot open shared object' /tmp/smoke.log; then
            echo "::error::missing shared library at runtime"; exit 1
          fi
          # 0 = clean exit, 124 = still running after 15s (good)
          if [ $code -ne 0 ] && [ $code -ne 124 ]; then
            echo "::error::AppImage smoke test failed (exit $code)"; exit 1
          fi

      - name: package windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "dist/slate-windows"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          New-Item -ItemType Directory -Force "$pkg/shaders" | Out-Null
          Copy-Item build/Release/slate.exe $pkg/
          Copy-Item build/Release/*.dll $pkg/ -ErrorAction SilentlyContinue
          Copy-Item -Recurse build/assets "$pkg/assets"
          Copy-Item -Recurse build/models "$pkg/models"
          Copy-Item -Recurse build/shaders/compiled "$pkg/shaders/compiled"

          # SDL3
          if (-not (Test-Path "$pkg/SDL3.dll")) {
            $dll = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/SDL3.dll"
            if (-not (Test-Path $dll)) { throw "SDL3.dll not found anywhere" }
            Copy-Item $dll $pkg/
          }

          # Vulkan loader: not shipped with Windows (GPU drivers install it), so bundle it app-local
          if (-not (Test-Path "$pkg/vulkan-1.dll")) {
            $vk = Get-ChildItem -Path $env:VULKAN_SDK -Recurse -Filter vulkan-1.dll -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match '\\Bin\\' } | Select-Object -First 1
            if (-not $vk) { throw "vulkan-1.dll not found in Vulkan SDK" }
            Copy-Item $vk.FullName $pkg/
          }

          # MSVC runtime, app-local, so clean machines don't need the VC++ redistributable
          foreach ($n in 'vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll') {
            $src = Join-Path $env:SystemRoot "System32/$n"
            if (-not (Test-Path $src)) { throw "$n not found in System32" }
            Copy-Item $src $pkg/
          }
          foreach ($n in 'msvcp140_1.dll','msvcp140_2.dll','msvcp140_atomic_wait.dll','msvcp140_codecvt_ids.dll','concrt140.dll') {
            $src = Join-Path $env:SystemRoot "System32/$n"
            if (Test-Path $src) { Copy-Item $src $pkg/ }
          }

          Compress-Archive -Path $pkg -DestinationPath dist/slate-windows-x86_64.zip
          Remove-Item -Recurse -Force $pkg

      - name: verify + smoke test windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # test the FINAL zip, extracted somewhere else
          $chk = Join-Path $env:RUNNER_TEMP "zipcheck"
          if (Test-Path $chk) { Remove-Item -Recurse -Force $chk }
          Expand-Archive dist/slate-windows-x86_64.zip $chk
          $root = Join-Path $chk "slate-windows"
          foreach ($f in 'slate.exe','SDL3.dll','vulkan-1.dll','vcruntime140.dll','msvcp140.dll','assets','models','shaders/compiled') {
            if (-not (Test-Path (Join-Path $root $f))) { throw "missing in zip: $f" }
          }
          if (-not (Get-ChildItem (Join-Path $root 'shaders/compiled') -Filter *.spv)) { throw "no .spv in zip" }

          # The runner has no GPU, so a graceful Vulkan failure is fine. A loader-level crash is not.
          $fatal = @{
            -1073741515 = 'STATUS_DLL_NOT_FOUND'
            -1073741701 = 'STATUS_INVALID_IMAGE_FORMAT (32/64-bit mismatch?)'
            -1073741511 = 'STATUS_ENTRYPOINT_NOT_FOUND'
            -1073741502 = 'STATUS_DLL_INIT_FAILED'
          }
          $args = @(); if ($env:SMOKE_ARGS) { $args = $env:SMOKE_ARGS -split '\s+' }
          if ($args.Count -gt 0) {
            $p = Start-Process -FilePath "$root/slate.exe" -ArgumentList $args -WorkingDirectory $root -PassThru
          } else {
            $p = Start-Process -FilePath "$root/slate.exe" -WorkingDirectory $root -PassThru
          }
          $null = $p.Handle   # cache the handle so ExitCode is readable
          if (-not $p.WaitForExit(15000)) {
            Stop-Process -Id $p.Id -Force
            Write-Host "still running after 15s - OK"
          } else {
            $code = $p.ExitCode
            Write-Host "exited with code $code"
            if ($fatal.ContainsKey($code)) { throw "loader failure: $($fatal[$code])" }
          }

      - name: package + test dmg
        if: runner.os == 'macOS'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || VERSION="0.0.0"

          APP=dist_dmg/SlateEngine.app
          RES="$APP/Contents/Resources"
          mkdir -p "$APP/Contents/MacOS" "$RES/vulkan/icd.d" "$RES/shaders" "$APP/Contents/Frameworks" dist

          cp build/slate "$APP/Contents/MacOS/slate-bin"
          cp -R build/assets build/models "$RES/"
          cp -R build/shaders/compiled "$RES/shaders/compiled"

          # launcher: run from Resources and point the Vulkan loader at the bundled MoltenVK
          cat > "$APP/Contents/MacOS/slate" << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          RES="$DIR/../Resources"
          export VK_ICD_FILENAMES="$RES/vulkan/icd.d/MoltenVK_icd.json"
          export VK_DRIVER_FILES="$VK_ICD_FILENAMES"
          cd "$RES"
          exec "$DIR/slate-bin" "$@"
          EOF
          chmod +x "$APP/Contents/MacOS/slate"

          MVK="$(brew --prefix molten-vk)/lib/libMoltenVK.dylib"
          test -f "$MVK" || { echo "::error::libMoltenVK.dylib not found at $MVK"; exit 1; }
          cp "$MVK" "$APP/Contents/Frameworks/"
          cat > "$RES/vulkan/icd.d/MoltenVK_icd.json" << 'EOF'
          {"file_format_version":"1.0.0","ICD":{"library_path":"../../../Frameworks/libMoltenVK.dylib","api_version":"1.2.0"}}
          EOF

          # app icon (png -> icns)
          ICONSET="$(mktemp -d)/slate.iconset"; mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/slate_icon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) assets/slate_icon.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$RES/slate.icns"

          # bundle SDL3, vulkan loader, etc.
          dylibbundler -od -b -cd -x "$APP/Contents/MacOS/slate-bin" \
            -d "$APP/Contents/Frameworks/" -p @executable_path/../Frameworks/

          # Homebrew bottles are built for the runner's macOS, so the real minimum is whatever the newest
          # bundled binary requires. Compute it instead of claiming a version we can't honor.
          MINOS=$(find "$APP/Contents" -type f \( -name '*.dylib' -o -name 'slate-bin' \) -print0 \
            | xargs -0 -n1 otool -l 2>/dev/null \
            | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; b=0} /LC_VERSION_MIN_MACOSX/{v=1} v&&/version/{print $2; v=0}' \
            | gsort -V | tail -n1)
          [ -n "$MINOS" ] || { echo "::error::could not determine minimum macOS version"; exit 1; }
          echo "minimum macOS required by bundle: $MINOS"

          cat > "$APP/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Slate Engine</string>
            <key>CFBundleDisplayName</key><string>Slate Engine</string>
            <key>CFBundleIdentifier</key><string>com.slate.engine</string>
            <key>CFBundleExecutable</key><string>slate</string>
            <key>CFBundleIconFile</key><string>slate</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>${MINOS}</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict></plist>
          EOF
          plutil -lint "$APP/Contents/Info.plist"

          # nothing may link outside the bundle / system
          bad=""
          while IFS= read -r -d '' f; do
            b=$(otool -L "$f" | tail -n +2 | awk '{print $1}' | grep -Ev '^(@|/usr/lib/|/System/)' || true)
            [ -n "$b" ] && bad="$bad"$'\n'"$f:"$'\n'"$b"
          done < <(find "$APP/Contents" -type f \( -name '*.dylib' -o -name 'slate-bin' \) -print0)
          if [ -n "$bad" ]; then echo "::error::external dylib references:$bad"; exit 1; fi

          # ad-hoc sign inside-out (dylibbundler invalidates signatures; arm64 won't run unsigned)
          find "$APP/Contents/Frameworks" -type f -name '*.dylib' -exec codesign --force --sign - {} \;
          codesign --force --sign - "$APP/Contents/MacOS/slate-bin"
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # build the dmg (fallback to plain hdiutil if Finder styling fails on the headless runner)
          DMG=dist/slate-macos-arm64.dmg
          if ! create-dmg --skip-jenkins \
              --volname "Slate Engine Installer" \
              --window-size 600 400 --icon-size 100 \
              --icon "SlateEngine.app" 175 120 \
              --hide-extension "SlateEngine.app" \
              --app-drop-link 425 120 \
              "$DMG" dist_dmg/; then
            echo "::warning::create-dmg failed, falling back to plain hdiutil"
            rm -f "$DMG" rw.*.dmg
            ln -sfn /Applications dist_dmg/Applications
            hdiutil create -volname "Slate Engine" -srcfolder dist_dmg -ov -format UDZO "$DMG"
          fi
          test -f "$DMG" || { echo "::error::dmg not produced"; exit 1; }
          hdiutil verify "$DMG"

          # --- verify + smoke test the app as it exists INSIDE the shipped dmg ---
          MNT="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          trap 'hdiutil detach "$MNT" -force >/dev/null 2>&1 || true' EXIT

          TESTDIR="$(mktemp -d)"
          ditto "$MNT/SlateEngine.app" "$TESTDIR/SlateEngine.app"
          T="$TESTDIR/SlateEngine.app"
          test -x "$T/Contents/MacOS/slate"                    || { echo "::error::launcher missing in dmg"; exit 1; }
          test -d "$T/Contents/Resources/assets"               || { echo "::error::assets missing in dmg"; exit 1; }
          test -d "$T/Contents/Resources/models"               || { echo "::error::models missing in dmg"; exit 1; }
          ls "$T"/Contents/Resources/shaders/compiled/*.spv >/dev/null 2>&1 || { echo "::error::shaders missing in dmg"; exit 1; }
          test -f "$T/Contents/Frameworks/libMoltenVK.dylib"   || { echo "::error::MoltenVK missing in dmg"; exit 1; }
          codesign --verify --deep --strict "$T"

          # only fail on loader errors; hosted macOS runners have unreliable GPU support
          set +e
          out=$(gtimeout 15 "$T/Contents/MacOS/slate" $SMOKE_ARGS 2>&1); code=$?
          set -e
          echo "$out" | tail -n 40
          echo "exit code: $code"
          if echo "$out" | grep -Eq 'Library not loaded|image not found|Symbol not found|dyld\['; then
            echo "::error::dyld error at launch"; exit 1
          fi

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slate-${{ matrix.name }}
          path: |
            dist/*.AppImage
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: verify + checksums
        run: |
          cd dist
          for f in slate-linux-x86_64.AppImage slate-windows-x86_64.zip slate-macos-arm64.dmg; do
            test -s "$f" || { echo "::error::missing or empty: $f"; ls -la; exit 1; }
          done
          test "$(ls | wc -l)" -eq 3 || { echo "::error::expected exactly 3 artifacts"; ls; exit 1; }
          unzip -tq slate-windows-x86_64.zip
          sha256sum * > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}